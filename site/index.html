<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.VP_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Findings Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Visual Findings Library</h1>
    <p class="sub">Open-access clinical imagery across the pilot disease library</p>
  </header>
  <main>
    <section id="diseases"><p>Loading&hellip;</p></section>
    <section class="compare-link">
      <a id="compare-link" href="/compare/sle-dm-skin">SLE vs DM skin comparison &rarr;</a>
    </section>
    <section class="articles">
      <h2>Source articles</h2>
      <p class="sub" id="articles-summary"></p>
      <ol id="articles"></ol>
    </section>
  </main>
  <script src="api.js"></script>
  <script>
    document.getElementById("compare-link").href = VP.compareUrl;
    const LICENSES = { "cc0": "CC0", "cc-by": "CC BY", "cc-by-sa": "CC BY-SA", "cc-by-nd": "CC BY-ND" };
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };

    Promise.all([VP.diseases(), VP.articles()]).then(([diseases, all]) => {
      const articles = all.filter(a => a.published_total > 0);
      const names = Object.fromEntries(diseases.map(d => [d.key, d.name]));
      const imagesBy = {};
      for (const a of articles)
        for (const [key, n] of Object.entries(a.published_images)) imagesBy[key] = (imagesBy[key] || 0) + n;

      const grid = document.getElementById("diseases");
      grid.replaceChildren();
      for (const d of diseases) {
        const card = el("a", "disease-card");
        card.href = VP.diseaseUrl(d.key);
        const n = imagesBy[d.key] || 0;
        card.append(el("h2", null, d.name), el("p", null, `${d.key.toUpperCase()} · ${n} image${n === 1 ? "" : "s"}`));
        if (!n) card.classList.add("empty-card");
        grid.append(card);
      }

      const total = articles.reduce((sum, a) => sum + a.published_total, 0);
      document.getElementById("articles-summary").textContent =
        `${articles.length} article${articles.length === 1 ? "" : "s"} · ${total} published image${total === 1 ? "" : "s"}`;
      const list = document.getElementById("articles");
      for (const a of articles) {
        const item = el("li", "article-item");
        const title = el("a", "article-title", a.title || a.pmcid);
        title.href = a.article_url; title.target = "_blank"; title.rel = "noopener noreferrer";
        const meta = el("p", "article-meta",
          [a.journal, a.year, a.pmcid, (a.publication_types || [])[0]].filter(Boolean).join(" · "));
        const tags = el("p", "article-tags");
        const license = el("span", "tag license", LICENSES[a.license_code] || a.license_code || "license unknown");
        tags.append(license);
        for (const key of a.disease_keys) {
          const n = a.published_images[key] || 0;
          const tag = el("a", "tag", `${names[key] || key}${n ? ` · ${n}` : ""}`);
          tag.href = VP.diseaseUrl(key);
          tags.append(tag);
        }
        item.append(title, meta, tags);
        list.append(item);
      }
    }).catch(() => {
      document.getElementById("diseases").innerHTML = "<p class='empty'>The library could not be loaded.</p>";
    });
  </script>
</body>
</html>
