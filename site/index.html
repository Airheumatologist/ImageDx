<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.VP_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Findings Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <header class="home-header">
    <h1>Visual Findings Library</h1>
    <label class="search">
      <span class="visually-hidden">Search diseases</span>
      <input id="search" type="search" placeholder="Disease, Specialty, Condition" autocomplete="off">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </label>
  </header>
  <nav class="home-tabs" role="tablist">
    <button type="button" role="tab" class="home-tab active" data-view="all" aria-selected="true">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
      All Diseases
    </button>
    <button type="button" role="tab" class="home-tab" data-view="specialty" aria-selected="false">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3v6a5 5 0 0 0 10 0V3"/><path d="M11 14v2a5 5 0 0 0 10 0v-3"/><circle cx="21" cy="11" r="2"/></svg>
      Specialties
    </button>
  </nav>
  <main id="diseases" class="disease-list"><p class="empty">Loading&hellip;</p></main>
  <script src="api.js"></script>
  <script>
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };
    const list = document.getElementById("diseases");
    const search = document.getElementById("search");
    let diseases = [];
    let view = "all";

    function matches(d, q) {
      if (!q) return true;
      const haystack = [d.name, d.key, d.specialty, d.summary, ...(d.synonyms || [])].join(" ").toLowerCase();
      return q.split(/\s+/).every(word => haystack.includes(word));
    }

    function row(d) {
      const link = el("a", "disease-row");
      link.href = VP.diseaseUrl(d.key);
      link.append(el("span", "disease-row-name", d.name));
      if (d.summary) link.append(el("span", "disease-row-summary", d.summary));
      return link;
    }

    function render() {
      const q = search.value.trim().toLowerCase();
      const shown = diseases.filter(d => matches(d, q));
      list.replaceChildren();
      if (!shown.length) { list.append(el("p", "empty", "No diseases match your search.")); return; }
      if (view === "all") {
        for (const d of shown) list.append(row(d));
        return;
      }
      const groups = new Map();
      for (const d of shown) {
        const name = d.specialty || "Other";
        if (!groups.has(name)) groups.set(name, []);
        groups.get(name).push(d);
      }
      for (const name of [...groups.keys()].sort()) {
        const section = el("section", "specialty-group");
        const heading = el("h2", "specialty-heading", name);
        heading.append(el("span", "specialty-count", String(groups.get(name).length)));
        section.append(heading, ...groups.get(name).map(row));
        list.append(section);
      }
    }

    for (const tab of document.querySelectorAll(".home-tab")) {
      tab.addEventListener("click", () => {
        view = tab.dataset.view;
        for (const other of document.querySelectorAll(".home-tab")) {
          other.classList.toggle("active", other === tab);
          other.setAttribute("aria-selected", String(other === tab));
        }
        render();
      });
    }
    search.addEventListener("input", render);

    VP.diseases().then(data => {
      diseases = data.slice().sort((a, b) => a.name.localeCompare(b.name));
      render();
    }).catch(() => {
      list.innerHTML = "<p class='empty'>The library could not be loaded.</p>";
    });
  </script>
</body>
</html>
