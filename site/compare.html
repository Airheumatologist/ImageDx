<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.VP_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SLE vs DM — skin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="home-link" href="/">&larr; all diseases</a>
    <h1>SLE vs dermatomyositis: skin</h1>
  </header>
  <main id="comparisons"></main>
  <div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <section class="lb-inner">
      <button id="lb-close" class="lb-close" type="button" data-close-lightbox aria-label="Close image details">Close</button>
      <div id="lb-media"></div>
      <div class="lb-info"><h2 id="lb-title"></h2><div id="lb-details"></div></div>
    </section>
  </div>
  <script src="api.js"></script>
  <script>
    document.getElementById("home-link").href = VP.homeUrl;
    const lb = document.getElementById("lightbox");
    let previouslyFocused = null;
    function closeLightbox() {
      lb.hidden = true;
      document.getElementById("lb-media").replaceChildren();
      if (previouslyFocused?.isConnected) previouslyFocused.focus();
    }
    lb.addEventListener("click", e => { if (e.target === lb || e.target.closest("[data-close-lightbox]")) closeLightbox(); });
    document.addEventListener("keydown", e => { if (!lb.hidden && e.key === "Escape") closeLightbox(); });
    function label(p) {
      return p.display_label || (p.findings || []).map(f => typeof f === "string" ? f : (f.label || f.key)).filter(Boolean).join(", ") || p.body_site || "Clinical image";
    }
    function openLightbox(p, src) {
      previouslyFocused = document.activeElement;
      const image = VP.panelImage(p, "lb-img", p.image || src); image.setAttribute("aria-label", label(p));
      document.getElementById("lb-media").replaceChildren(image);
      document.getElementById("lb-title").textContent = label(p);
      const details = document.getElementById("lb-details"); details.replaceChildren();
      const add = (title, text, href, container = details) => {
        if (!text) return;
        const row = document.createElement("p"), strong = document.createElement("strong");
        strong.textContent = `${title}: `; row.append(strong);
        if (href) { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = text; row.append(a); }
        else row.append(document.createTextNode(text));
        container.append(row);
      };
      const evidence = p.context || [p.figure_caption, ...(p.in_text_mentions || [])].filter(Boolean).join(" ");
      add("Context", evidence.length > 650 ? `${evidence.slice(0, 647).trimEnd()}…` : evidence);
      const sources = p.source_variants?.length ? p.source_variants : [p];
      const uniqueSources = [...new Map(sources.map(source => {
        const key = [source.article_url || source.doi_url, source.article_title, source.copyright || source.attribution_text, source.license_url, source.license_code].join("|");
        return [key, source];
      })).values()];
      const statedAge = age => Boolean(age) && !["unknown", "not stated", "unspecified", "not reported", "not available", "n/a", "na"].includes(String(age).trim().toLowerCase());
      const ages = [...new Set(sources.map(source => source.age_group_label).filter(statedAge))];
      const ageValues = ages.length ? ages : [p.age_group_label].filter(statedAge);
      if (ageValues.length) add(ageValues.length > 1 ? "Age groups noted" : "Age group noted", ageValues.join(" · "));
      const locations = [...new Set(sources.map(source => source.country).filter(Boolean))];
      const locationValues = locations.length ? locations : [p.country || p.study_region].filter(Boolean);
      if (locationValues.length) add(locationValues.length > 1 ? "Countries/regions listed in article metadata" : "Country/region listed in article metadata", locationValues.join(" · "));
      if (uniqueSources.length) {
        const heading = document.createElement("h3"); heading.className = "source-heading";
        heading.textContent = uniqueSources.length === 1 ? "Source" : "Sources"; details.append(heading);
      }
      uniqueSources.forEach(source => {
        const section = document.createElement("section"); section.className = "source-item";
        add("Article", source.article_title || "Article source", source.article_url || source.doi_url, section);
        const attribution = source.copyright || source.attribution_text;
        if (attribution) add("Copyright & attribution", attribution, null, section);
        if (source.license_code || source.license_url) add("License", source.license_code || "License details", source.license_url, section);
        if (source.figure_label) add("Figure", source.figure_label, null, section);
        details.append(section);
      });
      lb.hidden = false; document.getElementById("lb-close").focus();
    }
    function card(p) {
      const d = document.createElement("div");
      d.className = "panel-card";
      const img = p.thumb || p.image;
      if (!img) return d;
      const button = document.createElement("button"); button.type = "button"; button.className = "card-open";
      button.setAttribute("aria-label", `Open image: ${label(p)}`);
      const image = VP.panelImage(p, "thumb", img);
      const title = document.createElement("span"); title.className = "card-label"; title.textContent = label(p);
      button.append(image, title); button.addEventListener("click", () => openLightbox(p, img)); d.append(button);
      return d;
    }
    VP.compare().then(pairs => {
      const main = document.getElementById("comparisons");
      for (const pair of pairs) {
        const sec = document.createElement("section");
        sec.className = "comparison";
        sec.innerHTML = `<h2>${pair.title}</h2><div class="pair">
          <div class="side"><h3>${pair.left.label}</h3><div class="grid"></div></div>
          <div class="side"><h3>${pair.right.label}</h3><div class="grid"></div></div>
        </div>`;
        const [lg, rg] = sec.querySelectorAll(".grid");
        for (const p of pair.left.panels) lg.appendChild(card(p));
        for (const p of pair.right.panels) rg.appendChild(card(p));
        if (!pair.left.panels.length) lg.innerHTML = "<p class='empty'>no panels</p>";
        if (!pair.right.panels.length) rg.innerHTML = "<p class='empty'>no panels</p>";
        main.appendChild(sec);
      }
    });
  </script>
</body>
</html>
