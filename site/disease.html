<!DOCTYPE html>
<html lang="en">
<head>
  <script>window.VP_STATIC = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Disease library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="home-link" href="/">&larr; all diseases</a>
    <h1 id="title"></h1>
  </header>
  <section id="filters">
    <select id="f-subtype"><option value="">subtype: all</option></select>
    <select id="f-modality"><option value="">modality: all</option></select>
    <select id="f-finding"><option value="">finding: all</option></select>
    <select id="f-typicality">
      <option value="">typicality: all</option>
      <option value="classic">classic</option>
      <option value="variant">variant</option>
      <option value="atypical">atypical</option>
    </select>
    <select id="f-skin-tone" hidden>
      <option value="">skin tone: all</option>
      <option value="light">light</option>
      <option value="medium">medium</option>
      <option value="dark">dark</option>
      <option value="unknown">unknown</option>
    </select>
  </section>
  <p id="reserves-note" class="reserves-note" hidden></p>
  <main id="content"></main>

  <div id="lightbox" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <section class="lb-inner">
      <button id="lb-close" class="lb-close" type="button" data-close-lightbox aria-label="Close image details">Close</button>
      <div id="lb-media"></div>
      <div class="lb-info">
        <h2 id="lb-title"></h2>
        <div id="lb-details"></div>
      </div>
    </section>
  </div>

  <script src="api.js"></script>
  <script>
    const DISEASE = VP.diseaseKey();
    document.getElementById("home-link").href = VP.homeUrl;
  </script>
  <script src="app.js"></script>
</body>
</html>
